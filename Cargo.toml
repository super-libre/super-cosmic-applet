[package]
    name = "super-cosmic-applet"
    version = "0.1.1-beta.1"
    authors = ["Jorge Menjivar <jorge@menjivar.ai>"]
    edition = "2024"
    description = "COSMIC panel applet for Super STT and Super TTS"
    repository = "https://github.com/super-libre/super-cosmic-applet"
    license = "GPL-3.0-only"

# Its own workspace, wherever it is checked out. Each product's release, and
# its `just build-applet`, check it out inside the product's repo, where cargo
# would otherwise take it for an unlisted member of the product's workspace.
[workspace]

[[bin]]
    name = "super-cosmic-applet"
    path = "src/main.rs"

[dependencies]
    base64 = "0.22.1"
    clap = { version = "4.5", features = ["derive"] }
    # The logger super-engine's `logging::init` sets up, built here instead so
    # the applet can turn off libcosmic's per-redraw `info` line.
    env_logger = "0.11.11"
    futures-util = "0.3.31"
    libc = "0.2"
    # No `wgpu`: the applet renders with iced's tiny-skia backend, which draws
    # everything here, the visualization and working-animation canvases
    # included, on the CPU. A GPU renderer in a panel applet costs ~85 MB of RSS
    # per instance (108 MB against 23 MB, measured idle) because it loads the
    # Mesa and NVIDIA driver stacks at startup, and the applet runs one process
    # per side per panel. Upstream COSMIC draws the same line: its apps link
    # wgpu, its applets do not.
    #
    # Pinned by rev, at the same one as Super STT and Super TTS: libcosmic has
    # no releases, and a revision far from the installed COSMIC reads a theme
    # directory the desktop no longer writes.
    libcosmic = {
        git = "https://github.com/pop-os/libcosmic.git",
        rev = "ef162b8e16ba4493e05c169cd56c7b9f77f0fda5",
        default-features = false,
        features = ["default", "applet", "tokio"],
    }
    log = "0.4.29"
    # Watches the settings file, so a change in one applet's popup reaches the
    # others. The version libcosmic's own config watcher uses.
    notify = "8.2.0"
    # The settings file's format, and the version libcosmic writes its own
    # config with.
    ron = "0.12.2"
    serde = { version = "1.0.219", features = ["derive"] }
    serde_json = "1.0.149"
    # The applet talks to the daemon through super-engine's client, and takes
    # the daemon's names (its socket, scopes and topics) from Super Voice's
    # registry types crate.
    #
    # Both must name the SAME super-engine rev: the product crate depends on
    # super-engine-protocol at the rev its workspace pins, and a ProductSpec
    # from one rev is a different type from a ProductSpec of another. Bump the
    # engine here only together with super-stt's pin, and the super-stt rev
    # below to a commit that pins the same engine.
    super-engine-client = {
        git = "https://github.com/super-libre/super-engine",
        rev = "79e3ceace42d9492c60277abfaa4c08b63cf3fdb",
    }
    super-engine-protocol = {
        git = "https://github.com/super-libre/super-engine",
        rev = "79e3ceace42d9492c60277abfaa4c08b63cf3fdb",
    }
    super-voice-registry-types = {
        git = "https://github.com/jorge-menjivar/super-voice",
        rev = "c2ed7b6432ba4a72424e9eea23533274527ef0b6",
    }
    tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }

[lints.clippy]
    pedantic = { level = "warn", priority = -1 }

# Mirrors the clippy gate (see `just check`) so `cargo clippy` / `cargo build`
# apply the same standard as CI.
[lints.rust]
    unused_must_use = "deny"

[profile.release]
    lto = true
    panic = "abort"
    codegen-units = 1
