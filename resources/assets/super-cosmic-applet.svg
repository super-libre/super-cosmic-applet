<!--
  Super Applet: a hero badge, a charcoal S on a gold shield with a charcoal
  rim and a gold edge, for Super STT and Super TTS.

  The S is Fira Sans Heavy Italic's capital S (SIL Open Font License 1.1),
  converted to a path. The shield is plain geometry on the 128 grid.

  Keep both copies identical: resources/assets/ (drawn in the panel) and
  resources/icons/hicolor/scalable/apps/ (installed for the launcher entries).
-->
